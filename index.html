<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastro</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
 
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>Criar conta</h1>
      <p class="subtitle">Preencha os campos para se cadastrar.</p>
 
      <div class="form-group">
        <label for="userName">Nome</label>
        <input type="text" id="userName" name="userName" placeholder="Seu nome"/>
      </div>
 
      <div class="form-group">
        <label for="userEmail">Email</label>
        <input type="text" id="userEmail" name="userEmail" placeholder="seu@email.com"/>
      </div>
 
      <div class="form-group">
        <label for="userPassword">Senha</label>
        <input type="password" id="userPassword" name="userPassword" placeholder="••••••••"/>
      </div>
 
      <button class="btn btn-primary" style="width:100%" onclick="EnviarDadosUsuario()">Cadastrar</button>
 
      <p id="demo" class="msg"></p>
 
      <p class="text-muted text-small mt-2" style="text-align:center">
        Já tem conta? <a href="login.html" style="color:var(--accent)">Entrar</a>
      </p>
    </div>
  </div>
 
  <script>
    async function EnviarDadosUsuario() {
      const API_BASE_URL = "http://localhost:5055";
      const USUARIO_ENDPOINT = `/api/Usuario`;
      const msgEl = document.getElementById("demo");
 
      const userName     = document.getElementById("userName").value;
      const userEmail    = document.getElementById("userEmail").value;
      const userPassword = document.getElementById("userPassword").value;
 
      if (!userName || !userEmail || !userPassword) {
        msgEl.textContent = "Preencha todos os campos!";
        msgEl.className = "msg error";
        return;
      }
 
      const usuario = { nome: userName, email: userEmail, senha: userPassword };
 
      try {
        const response = await fetch(USUARIO_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(usuario)
        });
 
        if (response.ok) {
          const resultado = await response.json();
          msgEl.textContent = `Usuário ${resultado.nome} cadastrado com sucesso!`;
          msgEl.className = "msg success";
          document.getElementById("userName").value = "";
          document.getElementById("userEmail").value = "";
          document.getElementById("userPassword").value = "";
        } else {
          const erro = await response.text();
          msgEl.textContent = `Erro ao cadastrar: ${erro}`;
          msgEl.className = "msg error";
        }
      } catch (error) {
        msgEl.textContent = `Não foi possível conectar à API. ${error}`;
        msgEl.className = "msg error";
      }
    }
  </script>
</body>
</html>
